name: Build AWAAZ SOS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (sideloadable, no signing needed)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: awaaz-sos-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-debug.apk
          name: AWAAZ SOS ${{ github.ref_name }}
          body: |
            ## AWAAZ Suraksha — Voice-First Emergency Safety App
            Voice-first emergency safety app for women in India.
            Say **"Awaaz help me"** to trigger instant SOS.
            Download and sideload the APK on any Android phone.

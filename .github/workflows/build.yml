name: Build Awaaz Suraksha APK

on:
  push:
    branches: [ main, master, 'alwayspositivevibes-awaaz-suraksha-app' ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Reconstruct Flutter Android scaffold
        run: |
          set -euo pipefail
          # Save our custom files before flutter create wipes android/
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/awaaz/sos/MainActivity.kt
          test -f android/app/src/main/kotlin/com/awaaz/sos/SosTileService.kt
          test -f android/app/build.gradle
          test -f android/app/src/standard/AndroidManifest.xml
          test -f android/app/src/autoSms/AndroidManifest.xml
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/awaaz/sos/MainActivity.kt /tmp/MainActivity.kt
          cp android/app/src/main/kotlin/com/awaaz/sos/SosTileService.kt /tmp/SosTileService.kt
          cp android/app/build.gradle /tmp/AppBuild.gradle
          cp android/app/src/standard/AndroidManifest.xml /tmp/StandardManifest.xml
          cp android/app/src/autoSms/AndroidManifest.xml /tmp/AutoSmsManifest.xml

          # Save icons
          mkdir -p /tmp/icons
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -f "android/app/src/main/res/mipmap-${density}/ic_launcher.png" ]; then
              cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "/tmp/icons/ic_launcher_${density}.png"
            fi
          done

          # Save assets
          test -d assets
          mkdir -p /tmp/assets
          cp -r assets/. /tmp/assets/

          # Regenerate Android scaffold
          rm -rf android
          flutter create --platforms=android --org com.awaaz .

          # Restore our AndroidManifest
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Restore app-specific Android build files and components
          mkdir -p android/app/src/main/kotlin/com/awaaz/sos
          cp /tmp/MainActivity.kt android/app/src/main/kotlin/com/awaaz/sos/MainActivity.kt
          cp /tmp/SosTileService.kt android/app/src/main/kotlin/com/awaaz/sos/SosTileService.kt
          cp /tmp/AppBuild.gradle android/app/build.gradle
          mkdir -p android/app/src/standard android/app/src/autoSms
          cp /tmp/StandardManifest.xml android/app/src/standard/AndroidManifest.xml
          cp /tmp/AutoSmsManifest.xml android/app/src/autoSms/AndroidManifest.xml
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/awaaz/sos/MainActivity.kt
          test -f android/app/src/main/kotlin/com/awaaz/sos/SosTileService.kt
          test -f android/app/src/standard/AndroidManifest.xml
          test -f android/app/src/autoSms/AndroidManifest.xml

          # Restore icons
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -f "/tmp/icons/ic_launcher_${density}.png" ]; then
              mkdir -p "android/app/src/main/res/mipmap-${density}"
              cp "/tmp/icons/ic_launcher_${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            fi
          done

          # Restore assets
          mkdir -p assets
          cp -r /tmp/assets/. assets/
          test -s assets/models/vosk-model-small-en-in-0.4.zip
          test -s assets/siren.wav

          # Verify versioned app Gradle configuration
          grep -q 'minSdk = 24' android/app/build.gradle
          grep -q 'compileSdk = 36' android/app/build.gradle
          grep -q 'targetSdk = 34' android/app/build.gradle
          grep -q 'namespace = "com.awaaz.sos"' android/app/build.gradle
          grep -q 'applicationId = "com.awaaz.sos"' android/app/build.gradle
          grep -q 'standard {' android/app/build.gradle
          grep -q 'autoSms {' android/app/build.gradle

          # Set Kotlin version
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.1.0'/g" android/build.gradle
          grep -q 'org.jetbrains.kotlin.android" version "2.1.0"' android/settings.gradle

      - name: Build standard APK without SMS permission
        run: flutter build apk --debug --flavor standard --target-platform android-arm64 --dart-define=AUTO_SMS_ENABLED=false

      - name: Build optional automatic-SMS APK
        run: flutter build apk --debug --flavor autoSms --target-platform android-arm64 --dart-define=AUTO_SMS_ENABLED=true

      - name: Upload standard APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: awaaz-suraksha-standard-debug-apk
          path: build/app/outputs/flutter-apk/app-standard-debug.apk

      - name: Upload automatic-SMS APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: awaaz-suraksha-auto-sms-debug-apk
          path: build/app/outputs/flutter-apk/app-autoSms-debug.apk

      - name: Verify APKs and SMS permissions
        run: |
          set -euo pipefail
          STANDARD_APK=build/app/outputs/flutter-apk/app-standard-debug.apk
          AUTO_SMS_APK=build/app/outputs/flutter-apk/app-autoSms-debug.apk
          test -s "$STANDARD_APK"
          test -s "$AUTO_SMS_APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -print -quit)"
          test -x "$AAPT"
          "$AAPT" dump permissions "$STANDARD_APK" > /tmp/standard-permissions.txt
          "$AAPT" dump permissions "$AUTO_SMS_APK" > /tmp/auto-sms-permissions.txt
          for permission in SEND_SMS ACCESS_BACKGROUND_LOCATION REQUEST_INSTALL_PACKAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE RECEIVE_BOOT_COMPLETED; do
            if grep -Fq "android.permission.$permission" /tmp/standard-permissions.txt; then
              echo "The standard APK unexpectedly declares android.permission.$permission."
              exit 1
            fi
          done
          grep -q 'android.permission.SEND_SMS' /tmp/auto-sms-permissions.txt
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/auto-sms-permissions.txt
          for permission in REQUEST_INSTALL_PACKAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE RECEIVE_BOOT_COMPLETED; do
            if grep -Fq "android.permission.$permission" /tmp/auto-sms-permissions.txt; then
              echo "The Auto-SMS APK unexpectedly declares android.permission.$permission."
              exit 1
            fi
          done
name: Build AWAAZ SOS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure official Flutter Gradle setup
        run: |
          mkdir -p assets
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          rm -rf android
          flutter create --platforms=android --org com.awaaz .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle || true

      - name: Build debug APK (sideloadable, no signing needed)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: awaaz-sos-debug-apk
          path: build/app/outputs/flutter-apk/*.apk

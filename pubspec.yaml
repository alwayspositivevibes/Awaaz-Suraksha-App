name: awaaz_sos
description: Awaaz Suraksha — Voice-first emergency safety app for women in India.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Offline voice recognition without Android speech-service tones
  vosk_flutter:
    git:
      url: https://github.com/alphacep/vosk-flutter.git
      ref: e655a96f0ce0dadb5ea8900aa1ba23260c3ec904

  # Text to Speech
  flutter_tts: ^4.0.2

  # GPS Location
  geolocator: ^13.0.2

  # Audio Recording
  record: ^6.0.0

  # Open WhatsApp / tel: links
  url_launcher: ^6.3.1

  # Trusted Contacts Storage
  shared_preferences: ^2.3.3

  # Runtime Permissions
  permission_handler: ^11.3.1

  # Keep Screen On
  wakelock_plus: ^1.2.9

  # Foreground service for shake detection with the screen locked
  flutter_foreground_task: ^8.11.0
  flutter_local_notifications: ^18.0.1

  # Accelerometer for Shake-to-SOS
  sensors_plus: ^5.0.1

  # Path for saving audio files
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
    - assets/siren.wav
    - assets/models/vosk-model-small-en-in-0.4.zip
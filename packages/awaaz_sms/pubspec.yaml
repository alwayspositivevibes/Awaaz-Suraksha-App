name: awaaz_sms
description: Minimal Android SMS sender for foreground and foreground-service isolates.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.awaaz.sos.sms
        pluginClass: AwaazSmsPlugin
